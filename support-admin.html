<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>صندوق پشتیبانی | هم‌قدم</title>
  <style>
    :root{--bg:#f4f3ec;--paper:#fffefa;--ink:#18333b;--muted:#60747a;--line:#dce5e0;--teal:#176b67;--mint:#e2f2e9;--soft:#f2f7f3;--gold:#d8ae5c;--shadow:0 14px 38px #183d3510}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.85;padding:20px}.wrap{max-width:1180px;margin:auto}.brand{display:flex;align-items:center;gap:12px;margin:0 0 18px}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,var(--teal),#153e48);color:white;font-size:23px}.brand h1{font-size:19px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
    @media(prefers-color-scheme:dark){:root{--bg:#131e20;--paper:#1b2a2b;--ink:#edf6ef;--muted:#a9b9b0;--line:#334547;--mint:#27423c;--soft:#243436;--shadow:0 12px 30px #0002}}
    @media(max-width:620px){body{padding:9px}.card{padding:13px}}
  </style>
</head>
<body><div class="wrap"><header class="brand"><div class="mark">ر</div><div><h1>صندوق پشتیبانی هم‌قدم</h1><p>برای کارکنان پشتیبانی دارای نقش تأییدشده</p></div></header><main id="support-chat-root" class="rt-support-root card"><p>در حال آماده‌سازی…</p></main></div><script type="module" src="/src/support-chat.js"></script></body>
</html>
