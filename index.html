-items:center}.navlist{display:grid;gap:4px}.navitem{display:flex;gap:10px;align-items:center;width:100%;border:1px solid transparent;background:transparent;color:var(--ink);text-align:right;border-radius:12px;padding:9px 10px;font-size:13px}.navitem:hover{background:var(--soft)}.navitem.active{background:var(--mint);border-color:#c6e4d8;color:#164c46;font-weight:bold}.navicon{width:25px;flex:none;text-align:center;font-size:17px}.sidefoot{border-top:1px solid var(--line);padding:11px 8px 4px;color:var(--muted);font-size:11px;margin-top:12px}.main{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap;margin:2px 2px 14px}.pagehead h2{font-size:25px;line-height:1.5;margin:0}.pagehead p{color:var(--muted);font-size:13px;margin:3px 0 0;max-width:820px}.datechip{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:8px 12px;color:var(--muted);font-size:12px}.hero{border-radius:26px;padding:clamp(22px,4vw,40px);color:white;background:linear-gradient(118deg,#153d47,#176c66 65%,#25877a);box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}.hero:after{content:"راهِ دانایی";position:absolute;left:-14px;bottom:-45px;opacity:.06;font-size:clamp(45px,9vw,110px);font-weight:900;white-space:nowrap}.hero .eyebrow{color:#c4eadc;font-size:12px;font-weight:bold}.hero h2{font-size:clamp(24px,3.3vw,37px);margin:7px 0 10px;line-height:1.6;max-width:900px}.hero p{font-size:13px;max-width:850px;color:#e2f1ec;margin:0 0 15px}.hero .btn{position:relative;z-index:1}.grid{display:grid;gap:13px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);min-width:0}.card.flat{box-shadow:none}.card.tint{background:var(--soft)}.card h3{font-size:16px;margin:0 0 8 ng:24px;color:var(--muted);font-size:13px}.progress{height:8px;border-radius:99px;background:#e5ece8;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#65b7a6);width:0}.topicgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topiccard{border:1px solid var(--line);background:var(--paper);padding:16px;border-radius:16px;text-align:right;color:var(--ink)}.topiccard:hover{border-color:var(--teal2);box-shadow:var(--shadow)}.topiccard .icon{font-size:24px}.topiccard h3{margin:4px 0 5px}.topiccard p{margin:0;font-size:12px;color:var(--muted)}.quote{border-right:3px solid var(--gold);padding:8px 13px;background:var(--soft);border-radius:0 12px 12px 0;margin:10px 0}.tree{display:grid;gap:8px}.tree details{border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--paper)}.tree summary{font-weight:bold;cursor:pointer}.tree details p{font-size:13px;margin:8px 0 0}.checkrow{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:13px}.checkrow input{margin-top:7px;accent-color:var(--teal)}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.searchinput{margin:4px 0 12px}.footer{color:var(--muted);font-size:10px;text-align:center;padding:18px 4px}.frameWrap{border:1px solid var(--line);background:white;border-radius:16px;overflow:hidden}.frameWrap iframe{display:block;width:100%;height:78vh;min-height:780px;border:0;background:#f6f5ef}.toast{position:fixed;left:18px;bottom:18px;z-index:50;border-radius:12px;padding:11px 16px;background:#163f47;color:white;box-shadow:var(--shadow);max-width:min(460px,calc(100vw - 36px));font-size:12px}.hide{display:none!important}.stepnum{display:inline-grid;place-items:center;border-radius:8px;background:var(--mint);color:var(--teal);height:25px;min-width:25px;font-size:11px;font-weight:bold;margin-left:6px}.tablewrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0}.table{width:100%;border-collapse:collapse;min-width:520px;font-size:12px}.table th,.table td{padding:10px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}.table th{background:var(--soft)}.table tr:last-child td{border-bottom:0}.bookmark{border:0;background:transparent;font-size:19px;color:var(--gold);padding:2px}.lessonContent{font-size:14px;line-height:2}.lessonContent h4{margin:16px 0 5px}.ratingbuttons{display:flex;gap:7px;flex-wrap:wrap}.ratingbuttons .btn{font-size:12px}.sampleflag{font-size:10px;color:#876623;background:#fff3cf;border-radius:5px;padding:1px 5px;display:inline-block;margin-right:4px}.dark{--bg:#131f22;--paper:#1c2a2d;--ink:#e4eeea;--muted:#a9bbb8;--line:#34484a;--teal:#4eaaa0;--teal2:#6bc0b3;--mint:#23433f;--navy:#0e333a;--soft:#243336;--shadow:0 12px 35px #0003;color-scheme:dark}.dark .navitem.active{color:#b9eee4}.dark .pill{background:#304540;color:#cdebe0}.dark .notice.info{background:#1e3934;color:#c8eadf;border-color:#345f54}.dark .notice{background:#3c3424;color:#f4dfaa}.dark .notice.warn{background:#3c252a;color:#f1c7cd}.dark .sampleflag{background:#443a22;color:#f2dd9e}.dark .hero{background:linear-gradient(118deg,#102a31,#125951 65%,#1d6c62)}

<body><div class="app">
<header class="topbar"><div class="brand"><div class="brandmark" aria-hidden="true">ر</div><div><h1>هم‌قدم</h1><small>همراه مسیر علم، مطالعه و رشد</small></div></div><div class="topactions"><button class="btn" data-act="go" data-page="home">⌂ خانه</button><button class="btn" data-act="go" data-page="search">⌕ جست‌وجو</button><button class="btn" data-act="go" data-page="settings">⚙ پشتیبان و تنظیمات</button></div></header>

<div class="footer">هم‌قدم • مرحلهٔ پایهٔ احراز هویت و پروفایل سروری • بخش‌هایی از داده‌های قدیمی هنوز روی همین دستگاه ذخیره می‌شوند.</div></div><div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORE_KEY='rahe-talabegi-v1';
const NAV=[['home','🏠','نمای امروز'],['planner','🗓','برنامه‌ریز'],['goals','⛰','قله‌ها و هدف‌ها'],['study','📚','مرکز مطالعه'],['rahdan','🪶','راه‌دانِ نحو و صرف'],['ethics','🌱','اخلاق و بازنگری'],['beliefs','🧭','عقاید و استدلال'],['media','📱','سواد رسانه‌ای'],['amr','🤝','امر به معروف'],['family','🏡','خانه و خانواده'],['unity','☪','وحدت و گفت‌وگو'],['foods','🍃','گیاهان و خوراکی‌ها'],['journal','📝','گزارش روزانه'],['sources','🔎','منابع و راستی‌آزمایی'],['support','💬','پشتیبانی'],['settings','⚙','تنظیمات و پشتیبان']];
const TODAY=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function plannerBounds(anchor){let d=new Date((anchor||TODAY())+'T12:00:00');if(Number.isNaN(d.getTime()))d=new Date(TODAY()+'T12:00:00');const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');const start=new Date(d);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+6);return {weekStart:iso(start),weekEnd:iso(end),month:(anchor||TODAY()).slice(0,7),year:(anchor||TODAY()).slice(0,4)}}
const clone=x=>JSON.parse(JSON.stringify(x));
const DEFAULT={version:1,profile:{name:'',stage:'پایه یک',freeMinutes:60,studyStyle:'ترکیبی',holiday:'جمعه',welcomeDone:false,dark:false,fontScale:1,showJokes:true},ui:{page:'home',studyTab:'overview',search:'',reviewIndex:0,reviewIds:[],reveal:false,activeArticle:null},goals:[{id:'sample-goal-1',title:'مرور یک مبحث نحو',area:'علم و درس',horizon:'کوتاه‌مدت',reason:'تثبیت آموخته‌ها با مرور فعال',outcome:'بتوانم قاعده را با زبان خودم توضیح بدهم',due:'',status:'active',sample:true,steps:[{id:'sg1',title:'مطالعهٔ قاعده',done:false},{id:'sg2',title:'حل سه تمرین',done:false},{id:'sg3',title:'مرور بدون نگاه به کتاب',done:false}]}],tasks:[{id:'sample-task-1',title:'نمونه آزمایشی: مرور کوتاه نحو',category:'درس',date:TODAY(),start:'16:00',end:'16:25',priority:'متوسط',status:'pending',note:'این فعالیت نمونه است؛ زمان و موضوعش را متناسب با برنامه واقعی خودت ویرایش کن.',sample:true}],books:[{id:'sample-book-1',title:'دفتر نحو و صرف',author:'',kind:'دفتر شخصی',subject:'ادبیات عرب',progress:0,note:'نمونه آزمایشی؛ مشخصات کتاب درسی و چاپ مورد استفاده را خودت وارد کن.',sample:true}],notes:[],cards:[{id:'sample-card-1',front:'در جملهٔ «جاءَ الطالبُ»، فاعل را چگونه پیدا می‌کنیم؟',back:'«الطالبُ» فاعل است؛ با توجه به معنا و ساخت جمله، انجام‌دهندهٔ آمدن است و در این مثال علامت رفع آن ضمهٔ ظاهری است.',topic:'فاعل',due: TODAY(),level:0,sample:true}],mistakes:[],goalsArchive:[],daily:{},reflections:{},contentDone:[],bookmarks:[],mediaAudits:[],amrRecords:[],familyPlans:[],sources:[{id:'sample-src-1',title:'Media and information literate citizens: Think critically, click wisely!',author:'UNESCO / Alton Grizzle et al.',year:'2021؛ صفحهٔ وب به‌روزشده در 2026',kind:'کتاب راهنما/سواد رسانه‌ای',url:'https://www.unesco.org/en/articles/media-and-information-literate-citizens',note:'منبع آغازین برای آموزش سواد رسانه‌ای؛ برای هر ادعای پژوهشی باید بخش و صفحهٔ دقیق ثبت شود.',confidence:'منبع نهادی'},{id:'sample-src-2',title:'Dietary and Herbal Supplements',author:'National Center for Complementary and Integrative Health (NCCIH)',year:'صفحهٔ رسمی؛ تاریخ آخرین بررسی هنگام استفاده ثبت شود',kind:'راهنمای ایمنی سلامت',url:'https://www.nccih.nih.gov/health/dietary-and-herbal-supplements',note:'دربارهٔ تفاوت شواهد و امکان تداخل مکمل‌ها؛ جایگزین مشورت پزشکی نیست.',confidence:'منبع نهادی'}]};
DEFAULT.tasks[0].date=TODAY();DEFAULT.cards[0].due=TODAY();
let state=loadState(); window.__RAHE_STATE__=state;
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return clone(DEFAULT);const parsed=JSON.parse(raw);if(!parsed||parsed.version!==1||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.goals))return clone(DEFAULT);return {...clone(DEFAULT),...parsed,profile:{...clone(DEFAULT.profile),...(parsed.profile||{})},ui:{...clone(DEFAULT.ui),...(parsed.ui||{})}}}catch(e){return clone(DEFAULT)}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));return true}catch(e){toast('ذخیره‌سازی انجام نشد؛ فضای مرورگر یا اجازهٔ ذخیره را بررسی کن.');return false}}
function uid(prefix='x'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s,opts={}){if(!s)return 'بدون موعد';let d=new Date(s+'T12:00:00');if(isNaN(d))return esc(s);return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'short',day:'numeric',...opts}).format(d)}
function todayPersian(){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date())}
function isToday(s){return s===TODAY()}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hide'),3000)}
function setTheme(){document.body.classList.toggle('dark',!!state.profile.dark);document.documentElement.style.setProperty('--font-scale',String(Math.max(.9,Math.min(1.2,Number(state.profile.fontScale)||1))))}
function go(page){state.ui.page=page;save();render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function head(title,desc='',right=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div>${right?`<div>${right}</div>`:''}</div>`}
function btn(act,label,extra='',cls='btn'){return `<button type="button" class="${cls}" data-act="${act}" ${extra}>${label}</button>`}
function field(label,name,value='',type='text',extra='',span=false){return `<div class="field ${span?'span2':''}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function area(label,name,value='',extra='',span=false){return `<div class="field ${span?'span2':''}"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea></div>`}
function sel(label,name,opts,value='',span=false){return `<div class="field ${span?'span2':''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${opts.map(o=>{let v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`}).join('')}</select></div>`}
function stat(n,label){return `<div class="metric"><strong>${n}</strong><span>${label}</span></div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}

function renderRahdan(){return `${head('راه‌دان | محیط یادگیری نحو و صرف','نسخهٔ پیوست‌شده درون «هم‌قدم» تعبیه شده است؛ بانک درس‌ها، سؤال‌ها، راه‌حل‌ها، فلش‌کارت و پیشرفت آن حفظ شده است.')}<div class="notice info">اگر برای نخستین بار باز می‌کنی، بارگذاری محتوای داخلی ممکن است چند لحظه طول بکشد. این بخش وابسته به اینترنت نیست و به‌صورت داخلی از همان فایل راه‌دان تغذیه می‌شود.</div><div class="frameWrap"><iframe id="rahdanFrame" title="محیط راه‌دان برای یادگیری نحو و صرف" loading="lazy"></iframe></div><div class="card" style="margin-top:12px"><h3>نقطهٔ ادغام فنی</h3><p class="small">HTML اصلی راه‌دان داخل این فایل تعبیه شده تا محصول تک‌فایلی بماند؛ محیط آن در قاب جداگانه اجرا می‌شود و CSS و اسکریپت‌هایش با صفحهٔ اصلی تداخل ندارند. پیشرفت راه‌دان از کلید ذخیره‌سازی خودش استفاده می‌کند؛ دادهٔ آن در پشتیبان اصلی هم‌قدم ادغام نمی‌شود، پس از داخل خود راه‌دان نیز سوابق را نگه‌داری کن.</p></div>`}
function loadRahdan(){const f=document.getElementById('rahdanFrame');if(f&&!f.dataset.loaded){try{const bytes=Uint8Array.from(atob(RAHDAN_B64),c=>c.charCodeAt(0));f.srcdoc=new TextDecoder('utf-8').decode(bytes);f.dataset.loaded='1'}catch(e){f.insertAdjacentHTML('beforebegin','<div class="notice warn">بارگذاری راه‌دان انجام نشد. فایل HTML اصلی آسیب‌دیده یا مرورگر از این روش پشتیبانی نمی‌کند.</div>')}}}
const ETHICS=[{id:'sadaq',icon:'🪞',title:'صدق و امانت‌داری',lead:'صدق با دقت در خبر و امانت با حفظ حق دیگران همراه است.',ayat:'قرآن کریم؛ توبه، ۱۱۹ (ارجاع آیه؛ متن و تفسیر را از نسخه معتبر بررسی کن).',steps:['پیش از بازنشر خبر، منبع اولیه را بررسی کن.','قولی را که نداده‌ای به نام خودت ثبت نکن.','اگر اشتباهت روشن شد، اصلاح را آشکار و بی‌بهانه انجام بده.'],practice:'امروز یک گزاره را که درباره‌اش مطمئن نیستی، پیش از گفتن با عبارت «تا جایی که بررسی کرده‌ام» دقیق‌تر بیان کن.'},{id:'ikhlas',icon:'🌿',title:'اخلاص و مراقبت از نیت',lead:'نیت را می‌توان بازبینی کرد، اما درباره باطن دیگران حکم قطعی نمی‌دهیم.',ayat:'موضوع نیازمند مطالعه تفسیری؛ ارجاع دقیق آیه را هنگام تدریس ثبت کن.',steps:['هدف کار را در یک جمله بنویس.','بپرس اگر تحسین نشوم، آیا اصل کار ارزش ادامه دارد؟','میان اصلاح نیت و وسواس یا خودسرزنشی فرق بگذار.'],practice:'قبل از یک کار علمی، دلیل انجامش را در یک جمله ثبت کن.'},{id:'tawadu',icon:'📖',title:'تواضع علمی',lead:'دانشجو می‌تواند محکم استدلال کند و در عین حال احتمال خطای خود را بپذیرد.',ayat:'برای استناد قرآنی و روایی دقیق، متن و منبع اولیه را ثبت کن.',steps:['نظر طرف مقابل را پیش از نقد، منصفانه بازگو کن.','دانسته، حدس و نقل را جدا کن.','برای پرسشی که پاسخ نداری، «نمی‌دانم» را مجاز بدان.'],practice:'یک پرسش حل‌نشده از درس را یادداشت کن و منبعی برای بررسی آن مشخص کن.'},{id:'lisan',icon:'🗣️',title:'زبان، خشم و آبروی مردم',lead:'صراحت علمی مجوز تحقیر و افشای بی‌دلیل حریم دیگران نیست.',ayat:'حجرات، ۱۱ـ۱۲ از آیات مرتبط با تمسخر، بدگمانی و غیبت است؛ متن و تفسیر کامل بررسی شود.',steps:['پیش از پاسخ تند، چند لحظه مکث کن.','نقد رفتار را از ارزش شخص جدا کن.','خبر خصوصی یا اتهام را بی‌نیاز و بی‌بررسی بازگو نکن.'],practice:'یک عبارت انتقادی را طوری بازنویسی کن که دقیق باشد و تحقیر نکند.'},{id:'haq',icon:'🤲',title:'حق‌الناس و جبران',lead:'جبران باید امن، سنجیده، قانونی و متناسب با حق ضایع‌شده باشد.',ayat:'جزئیات فقهی را با مرجع تقلید یا استاد آگاه بررسی کن.',steps:['واقعیت رخداد را بدون توجیه ثبت کن.','راه‌های جبران امن را بررسی کن.','اگر وضعیت پیچیده است، پیش از اقدام از فرد دانا راهنمایی بگیر.'],practice:'اگر مسئله‌ای داری، فقط قدم امن و روشن بعدی را بنویس؛ لازم نیست جزئیات حساس را وارد برنامه کنی.'},{id:'advice',icon:'🤝',title:'نصیحت و شنیدن نقد',lead:'نه هر نصیحتی درست است و نه هر ناراحتی‌ای نادرستی آن را ثابت می‌کند.',ayat:'نحل، ۱۲۵؛ دعوت به راه خدا با حکمت و موعظه نیکو و گفت‌وگوی نیکوتر.',steps:['موضوع را دقیق بشناس.','موقعیت و حریم خصوصی را رعایت کن.','به امکان اثر و احتمال آسیب توجه کن.'],practice:'برای یک گفت‌وگوی دشوار، هدف، دلیل و لحن محترمانه را از پیش بنویس.'}];
function renderEthics(){const date=TODAY(),d=state.daily[date]||{};return `${head('اخلاق و بازنگری روزانه','خودسنجی اختیاری و محرمانه؛ این بخش درباره ارزش انسان، قبول عبادت یا حکم قطعی معنوی داوری نمی‌کند.')}<div class="notice">اطلاعات این صفحه محلی ذخیره می‌شود. اگر دستگاه مشترک است، یادداشت‌های خیلی حساس ننویس؛ قفل سادهٔ دستگاه امن‌تر از یک PIN نمایشی داخل فایل است.</div><div class="grid two"><section class="card"><h3>🌱 ثبت اختیاری امروز</h3><form data-form="daily"><div class="formgrid">${field('دقایق مطالعه','studyMins',d.studyMins??'','number','min="0" max="1440"')}${field('زمان خواب (ساعت)','sleepHours',d.sleepHours??'','number','min="0" max="24" step="0.25"')}${field('حرکت یا ورزش (دقیقه)','moveMins',d.moveMins??'','number','min="0" max="1440"')}${field('خدمت یا کمک به خانواده (اختیاری)','service',d.service??'','text')}${area('عادتی می‌خواهم بهبود دهم (اختیاری)','habit',d.habit??'')}${area('محرک یا موقعیت؛ بدون جزئیات خصوصی','trigger',d.trigger??'')}</div><button class="btn primary" type="submit">ذخیرهٔ بازنگری امروز</button> ${btn('daily-delete','حذف ثبت امروز','', 'btn danger')}</form><p class="tiny muted">اعداد صرفاً خوداظهاری‌اند؛ از آن‌ها حکم اخلاقی یا معنوی استخراج نمی‌شود.</p></section><section class="card tint"><h3>مکث ← فهم ← جبران ← قدم بعدی</h3><ol class="small"><li>مکث کن؛ ابتدا از واکنش فوری فاصله بگیر.</li><li>محرک یا شرایط را بدون تحقیر خودت بشناس.</li><li>اگر حقی ضایع شده، امکان جبران امن و قانونی را بررسی کن.</li><li>یک تصمیم کوچک و قابل انجام برای نوبت بعد بنویس.</li></ol><div class="quote">«لغزش، تمام هویت تو نیست؛ آنچه می‌کنی این است که مسئولانه از آن چه یاد می‌گیری.»</div><p class="tiny muted">متن بالا یادآور ادبی ساخته‌شده برای برنامه است و نقل‌قول دینی نیست.</p></section></div><section class="card" style="margin-top:13px"><h3>کتابخانهٔ موضوعی اخلاق</h3><div class="grid two">${ETHICS.map(a=>`<article class="item"><div class="itemtitle">${a.icon} ${a.title}</div><p>${a.lead}</p><details><summary class="small">بازکردن تمرین و نکته‌ها</summary><p><b>ارجاع:</b> ${a.ayat}</p><ol>${a.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="quote"><b>تمرین:</b> ${a.practice}</div>${btn('content-done',state.contentDone.includes('ethics-'+a.id)?'مطالعه شد ✓':'ثبت مطالعه',`data-key="ethics-${a.id}"`,'btn soft small')}</details></article>`).join('')}</div></section>`}
const BELIEFS=[{t:'مبانی معرفت',level:'مقدماتی',summary:'فرق ادعا، دلیل، شاهد، بدیهی و نتیجه؛ شناخت خطاهای استدلال و حدود هر روش.'},{t:'خداشناسی و توحید',level:'مقدماتی تا پیشرفته',summary:'واژه‌های واجب، ممکن و ممتنع در چارچوب هر تقریر؛ برهان امکان و وجوب، حدوث، نظم، فطرت و تقریرهای صدیقین.'},{t:'صفات الهی',level:'متوسط',summary:'علم، قدرت، اراده، حیات، وحدت و نسبت صفات با ذات؛ اصطلاح‌ها را در متن مکتب انتخاب‌شده تعریف کن.'},{t:'عدل و مسئله شر',level:'متوسط',summary:'صورت‌بندی دقیق مسئله، فرق شر اخلاقی و طبیعی، اختیار، رنج و پاسخ‌های متنوع؛ اعتراض جدی را منصفانه نقل کن.'},{t:'نبوت و وحی',level:'متوسط',summary:'نبوت عامه و خاصه، ضرورت و امکان، اعجاز، اعتبار نقل و مسائل فهم وحی.'},{t:'امامت',level:'متوسط تا پیشرفته',summary:'تعریف امامت، ادله مورد استناد متکلمان امامیه و بررسی دیدگاه‌های متفاوت درون سنت اسلامی.'},{t:'معاد و زندگی پس از مرگ',level:'متوسط',summary:'امکان معاد، هویت شخصی، جسمانی/روحانی بودن معاد و استدلال‌های مختلف.'},{t:'اختیار، دعا و قضا و قدر',level:'پیشرفته',summary:'علیت، مسئولیت اخلاقی، اختیار، دعا و نسبت اراده انسان با اراده الهی.'}];
function renderBeliefs(){let active=state.ui.beliefOpen||'';return `${head('عقاید و استدلال','نقشه‌ای از موضوع‌ها برای مطالعه شاخه‌ای. محتوای این صفحه راهنمای مسیر است، نه جایگزین متن کلامی، پژوهش سندی یا درس استاد.')}

ٔ پژوهشی ذخیره نشده است.')}</section>`}

function renderAmr(){const checks=[['knows','موضوع را دقیق می‌شناسم و اشتباه در تشخیص نمی‌دهم.'],['ruling','حکم مربوط را از منبع فقهی معتبر می‌دانم.'],['effect','احتمال اثر روش انتخابی را سنجیده‌ام.'],['harm','خطر آسیب یا مفسده جدی را بررسی کرده‌ام.'],['respect','روش خصوصی، محترمانه و کم‌آسیب‌تر را در نظر گرفته‌ام.'],['advice','اگر ابهام دارم از استاد/مرجع یا فرد آگاه راهنمایی می‌گیرم.']];return `${head('امر به معروف و نهی از منکر','دانشنامهٔ آموزشی برای تشخیص مسئولانه، گفت‌وگوی محترمانه و شناخت حدود فقهی؛ این ابزار فتوا صادر نمی‌کند.')}

<section class="card" style="margin-top:13px"><h3>نمونهٔ گفت‌وگوی محترمانه</h3><div class="quote">«ممکن است من همهٔ موضوع را ندانم. می‌توانیم با هم منبع و حکم مسئله را بررسی کنیم؟ اگر برداشت من اشتباه است، خوشحال می‌شوم اصلاحش کنم.»</div><p class="small muted">این جمله نمونهٔ آموزشیِ ساخته‌شده برای تمرین است، نه نقل‌قول دینی یا حکم فقهی.</p></section>`}

function renderSearch(){const q=state.ui.search||'';const all=[];for(const [id,label,desc] of NAV)all.push({id,title:label,body:desc});for(const g of state.goals)all.push({id:'goals',title:g.title,body:g.reason+' '+g.outcome});for(const t of state.tasks)all.push({id:'planner',title:t.title,body:t.category+' '+t.note});for(const n of state.notes)all.push({id:'study',title:n.title,body:n.subject+' '+n.points+' '+n.questions});for(const c of state.cards)all.push({id:'study',title:c.front,body:c.back+' '+c.topic});for(const m of MEDIA)all.push({id:'media',title:m.t,body:m.p});for(const a of ETHICS)all.push({id:'ethics',title:a.title,body:a.lead+' '+a.practice});let res=q?all.filter(x=>(x.title+' '+(x.body||'')).toLowerCase().includes(q.toLowerCase())).slice(0,60):[];return `${head('جست‌وجوی سراسری','در عنوان‌ها، هدف‌ها، برنامه‌ها، یادداشت‌ها و کتابخانهٔ آموزشی جست‌وجو کن.')}<section class="card"><label for="searchQ" class="field"><span>عبارت جست‌وجو</span><input id="searchQ" class="searchinput" placeholder="مثلاً اعراب تقدیری، مباحثه، سوگیری تأییدی…" value="${esc(q)}"></label><div id="searchList">${q?(res.length?`<div class="stack">${res.map(r=>`<div class="item"><b>${esc(r.title)}</b><p class="small muted">${esc(String(r.body||'').slice(0,260))}</p>${btn('go','بازکردن بخش','data-page="'+esc(r.id)+'"','btn small')}</div>`).join('')}</div>`:empty('نتیجه‌ای پیدا نشد؛ عبارت ساده‌تر یا بخشی از عنوان را امتحان کن.')):empty('عبارت یا نام موضوع را بنویس.')}</div></section>`}
function makeCSV(rows){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){downloadFile('rahe-talabegi-backup-'+TODAY()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('پشتیبان JSON آماده شد.')}
function addTask(form){const d=Object.fromEntries(new FormData(form));if(!d.title.trim()){toast('عنوان فعالیت را وارد کن.');return}if(d.start&&d.end&&d.date===TODAY()&&d.end<d.start){if(!confirm('ساعت پایان از شروع زودتر است؛ فعالیت شبانه است؟'))return}state.tasks.push({id:uid('task'),title:d.title.trim(),category:d.category,date:d.date,start:d.start,end:d.end,priority:d.priority,status:'pending',note:d.note||'',sample:false});save();render();toast('فعالیت ثبت شد.')}
function addGoal(form){const d=Object.fromEntries(new FormData(form));const steps=(d.steps||'').split(/\n+/).map(x=>x.replace(/^\s*(?:\d+[.\-،)]|[-•])\s*/,'').trim()).filter(Boolean).map(title=>({id:uid('step'),title,done:false}));state.goals.push({id:uid('goal'),title:d.title.trim(),area:d.area,horizon:d.horizon,reason:d.reason||'',outcome:d.outcome||'',due:d.due||'',status:'active',sample:false,steps});save();render();toast('قله ساخته شد.')}
function addBook(form){const d=Object.fromEntries(new FormData(form));state.books.push({id:uid('book'),...d,progress:Math.max(0,Math.min(100,Number(d.progress)||0)),sample:false});save();render();toast('منبع ثبت شد.')}
function addCard(form){const d=Object.fromEntries(new FormData(form));state.cards.push({id:uid('card'),front:d.front.trim(),back:d.back.trim(),topic:d.topic||'',due:d.due||TODAY(),level:0,sample:false});save();render();toast('فلش‌کارت ساخته شد.')}
function addNote(form){const d=Object.fromEntries(new FormData(form));state.notes.push({id:uid('note'),...d});save();render();toast('یادداشت ذخیره شد.')}
function addMistake(form){const d=Object.fromEntries(new FormData(form));state.mistakes.push({id:uid('mistake'),...d});save();render();toast('مورد برای مرور ثبت شد.')}
function addSource(form){const d=Object.fromEntries(new FormData(form));if(d.url&&!/^https?:\/\//i.test(d.url)){toast('پیوند باید با http:// یا https:// آغاز شود.');return}state.sources.push({id:uid('source'),...d,sample:false});save();render();toast('منبع ثبت شد.')}
function addReflection(form){const d=Object.fromEntries(new FormData(form));state.reflections[TODAY()]={...d,updatedAt:new Date().toISOString()};save();render();toast('گزارش روزانه ذخیره شد.')}
function profileSubmit(form){const d=Object.fromEntries(new FormData(form));state.profile={...state.profile,...d,freeMinutes:Math.max(0,Math.min(1440,Number(d.freeMinutes)||0)),welcomeDone:true};save();render();toast('تنظیمات ذخیره شد.')}
function deleteBy(arr,id,msg){const x=arr.findIndex(z=>z.id===id);if(x<0)return;if(confirm(msg||'این مورد حذف شود؟')){arr.splice(x,1);save();render();toast('حذف شد.')}}
function dateShift(days){const d=new Date();d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function allSamplesDelete(){if(!confirm('همهٔ موارد نمونه‌ای حذف شود؟ داده‌های شخصی حفظ می‌شوند.'))return;for(const k of ['goals','tasks','books','cards','notes','mistakes','sources'])state[k]=state[k].filter(x=>!x.sample);save();render();toast('موارد نمونه حذف شدند.')}
function isValidBackup(x){
  const isRecord=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  if(!isRecord(x)||x.version!==1||!isRecord(x.profile))return false;
  for(const k of ['tasks','goals','books','cards'])if(!Array.isArray(x[k]))return false;
  const recordArrays=['tasks','goals','books','notes','cards','mistakes','goalsArchive','mediaAudits','amrRecords','familyPlans','sources'];
  for(const k of recordArrays){if(x[k]!==undefined&&(!Array.isArray(x[k])||!x[k].every(isRecord)))return false;}
  for(const k of ['contentDone','bookmarks'])if(x[k]!==undefined&&(!Array.isArray(x[k])||!x[k].every(v=>typeof v==='string')))return false;
  for(const k of ['ui','daily','reflections'])if(x[k]!==undefined&&!isRecord(x[k]))return false;
  if(!x.tasks.every(t=>typeof t.id==='string'&&typeof t.title==='string'))return false;
  if(!x.goals.every(g=>typeof g.id==='string'&&typeof g.title==='string'&&Array.isArray(g.steps)&&g.steps.every(st=>isRecord(st)&&typeof st.title==='string')))return false;
  if(!x.books.every(b=>typeof b.id==='string'&&typeof b.title==='string'))return false;
  if(!x.cards.every(c=>typeof c.id==='string'&&typeof c.front==='string'&&typeof c.back==='string'))return false;
  return true;
}
function restoreBackup(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!isValidBackup(x))throw new Error('ساختار نامعتبر');if(!confirm('داده‌های فعلی جایگزین شوند؟ بهتر است ابتدا از وضعیت فعلی پشتیبان بگیری.'))return;state={...clone(DEFAULT),...x,ui:{...clone(DEFAULT.ui),...(x.ui||{})},profile:{...clone(DEFAULT.profile),...(x.profile||{})}};const persisted=save();render();toast(persisted?'پشتیبان با موفقیت بازیابی شد.':'پشتیبان در همین نشست بارگذاری شد، اما مرورگر ذخیره‌سازی پایدار را نپذیرفت؛ پس از رفع مشکل، خروجی JSON بگیر.')}catch(e){toast('فایل پشتیبان نامعتبر است؛ داده‌های فعلی تغییری نکردند.')}};reader.onerror=()=>toast('خواندن فایل ممکن نشد.');reader.readAsText(file)}
function handleForm(form){const type=form.dataset.form;if(type==='task')return addTask(form);if(type==='goal')return addGoal(form);if(type==='book')return addBook(form);if(type==='card')return addCard(form);if(type==='note')return addNote(form);if(type==='mistake')return addMistake(form);if(type==='source')return addSource(form);if(type==='journal')return addReflection(form);if(type==='daily'){const d=Object.fromEntries(new FormData(form));state.daily[TODAY()]={...d,updatedAt:new Date().toISOString()};save();render();return toast('بازنگری امروز ذخیره شد.')}if(type==='profile'||type==='preferences'){const d=Object.fromEntries(new FormData(form));state.profile={...state.profile,...d,freeMinutes:Math.max(0,Math.min(1440,Number(d.freeMinutes)||0)),dark:d.dark==='true'?true:d.dark==='false'?false:!!state.profile.dark,showJokes:d.showJokes==='true'?true:d.showJokes==='false'?false:!!state.profile.showJokes,fontScale:Number(d.fontScale)||state.profile.fontScale,welcomeDone:true};save();render();return toast('تنظیمات ذخیره شد.')}if(type==='belief-note'){const d=Object.fromEntries(new FormData(form));state.notes.push({id:uid('note'),date:TODAY(),title:'برگهٔ پژوهش: '+d.topic,subject:'برگه پژوهش عقاید',points:d.claim+'\n'+d.premises,questions:d.objection,evidence:d.source,next:''});save();render();return toast('برگهٔ پژوهش ذخیره شد.')}if(type==='media-check'){const d=Object.fromEntries(new FormData(form));state.mediaAudits.push({id:uid('media'),date:TODAY(),purpose:'تمرین سواد رسانه‌ای: '+d.id,trigger:'تمرین',minutes:'',note:d.note||'',checks:Object.keys(d).filter(k=>/^c\d+$/.test(k))});save();render();return toast('تمرین رسانه‌ای ثبت شد.')}if(type==='factcheck'){const d=Object.fromEntries(new FormData(form));state.notes.push({id:uid('note'),date:TODAY(),title:'برگهٔ راستی‌آزمایی',subject:'سواد رسانه‌ای',points:d.claim,questions:d.unknown,evidence:d.origin+'\n'+d.evidence,next:d.conclusion});save();render();return toast('برگهٔ راستی‌آزمایی ذخیره شد.')}if(type==='audit'){const d=Object.fromEntries(new FormData(form));state.mediaAudits.push({id:uid('audit'),...d});save();render();return toast('ممیزی رسانه ذخیره شد.')}if(type==='unity'){const d=Object.fromEntries(new FormData(form));state.notes.push({id:uid('note'),date:TODAY(),title:'تمرین گفت‌وگو: '+d.topic,subject:'وحدت و گفت‌وگو',points:'دیدگاه اول: '+d.viewA+'\nدیدگاه دوم: '+d.viewB,questions:d.difference,evidence:d.source,next:''});save();render();return toast('تمرین گفت‌وگو ذخیره شد.')}if(type==='food-claim'){const d=Object.fromEntries(new FormData(form));state.notes.push({id:uid('note'),date:TODAY(),title:'بررسی ادعای تغذیه‌ای: '+d.item,subject:'دانشنامه خوراکی‌ها',points:d.claim,questions:d.safety,evidence:d.source,next:''});save();render();return toast('بررسی ذخیره شد.')}}
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();handleForm(f);return}if(e.target.id==='amr-form'){e.preventDefault();const d=new FormData(e.target),keys=['knows','ruling','effect','harm','respect','advice'],good=keys.filter(k=>d.get(k)==='on').length,method=d.get('method');let msg='';if(good===keys.length)msg='همهٔ پرسش‌های اولیه علامت خورده‌اند؛ با این حال، این نتیجه فتوا یا تضمین درستی اقدام نیست. جزئیات مسئله و منبع فقهی را بررسی کن.';else msg=`${keys.length-good} پرسش هنوز پاسخ روشن ندارد. عجله نکن؛ شناخت موضوع، حکم و پیامد را کامل کن و در صورت ابهام از فرد آگاه راهنمایی بگیر.`;document.getElementById('amr-result').innerHTML=`<div class="notice info" style="margin-top:12px"><b>جمع‌بندی آموزشی</b><p>${esc(msg)}</p><p>روش انتخاب‌شده: ${esc(method)}</p></div>`;state.amrRecords.push({id:uid('amr'),date:TODAY(),good,method});save();return}});
document.addEventListener('input',e=>{if(e.target.id==='searchQ'){state.ui.search=e.target.value;const all=[];for(const [id,label,desc] of NAV)all.push({id,title:label,body:desc});for(const g of state.goals)all.push({id:'goals',title:g.title,body:g.reason+' '+g.outcome});for(const t of state.tasks)all.push({id:'planner',title:t.title,body:t.category+' '+t.note});for(const n of state.notes)all.push({id:'study',title:n.title,body:n.subject+' '+n.points+' '+n.questions});for(const c of state.cards)all.push({id:'study',title:c.front,body:c.back+' '+c.topic});for(const m of MEDIA)all.push({id:'media',title:m.t,body:m.p});for(const a of ETHICS)all.push({id:'ethics',title:a.title,body:a.lead+' '+a.practice});const q=e.target.value,res=q?all.filter(x=>(x.title+' '+(x.body||'')).toLowerCase().includes(q.toLowerCase())).slice(0,60):[];const dest=document.getElementById('searchList');if(dest)dest.innerHTML=q?(res.length?`<div class="stack">${res.map(r=>`<div class="item"><b>${esc(r.title)}</b><p class="small muted">${esc(String(r.body||'').slice(0,260))}</p>${btn('go','بازکردن بخش','data-page="'+esc(r.id)+'"','btn small')}</div>`).join('')}</div>`:empty('نتیجه‌ای پیدا نشد.')):empty('عبارت یا نام موضوع را بنویس.');save()}if(e.target.id==='food-search'){state.ui.foodQ=e.target.value;const s=e.target.selectionStart;render();const x=document.getElementById('food-search');x.focus();x.setSelectionRange(s,s)}});

if(a==='light-day'){if(!confirm('سه فعالیت سبک نمونه برای امروز افزوده شود؟'))return;[['مرور ۱۰ دقیقه‌ای یک نکته','درس',10],['مرتب‌کردن یک یادداشت','مطالعه',10],['استراحت و حرکت کوتاه','سلامت',10]].forEach(([title,category,m])=>state.tasks.push({id:uid('task'),title:'نسخه سبک: '+title,category,date:TODAY(),start:'',end:'',priority:'کم',status:'pending',note:'پیشنهاد قابل ویرایش؛ اگر امروز مناسب نیست حذفش کن.',sample:false}));save();render();return toast('سه فعالیت سبک افزوده شد؛ ساعت‌ها را خودت تنظیم کن.')}
if(a==='goal-step'){return}
