name: Build Verified Android APK (Direct Download)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and verify Hamghadam APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run project tests
        run: npm test

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://gnbwcupxtbsjdgnncort.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
        env:
          VITE_SUPABASE_URL: https://gnbwcupxtbsjdgnncort.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build clean debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK and prepare direct-download files
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist-download

          if [ ! -s "$APK" ]; then
            echo "::error::APK output was not created or is empty."
            exit 1
          fi

          cp "$APK" dist-download/hamghadam-android.apk

          echo "Checking APK archive integrity..."
          unzip -t dist-download/hamghadam-android.apk

          echo "Checking APK signature..."
          "$TOOLS/apksigner" verify --verbose dist-download/hamghadam-android.apk

          echo "Checking Android package manifest..."
          "$TOOLS/aapt" dump badging dist-download/hamghadam-android.apk | tee dist-download/apk-badging.txt
          grep -q "package: name='ir.rahetalabegi.app'" dist-download/apk-badging.txt
          grep -q "sdkVersion:" dist-download/apk-badging.txt

          (
            cd dist-download
            sha256sum hamghadam-android.apk > SHA256SUMS.txt
          )

          echo "APK size:"
          ls -lh dist-download/hamghadam-android.apk
          echo "SHA-256:"
          cat dist-download/SHA256SUMS.txt

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamghadam-verified-apk
          path: |
            dist-download/hamghadam-android.apk
            dist-download/SHA256SUMS.txt
            dist-download/apk-badging.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Point direct-download release to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force android-latest "$GITHUB_SHA"
          git push --force origin refs/tags/android-latest

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: هم‌قدم — آخرین نسخه اندروید
          body: |
            آخرین APK برنامه هم‌قدم که در GitHub Actions ساخته و اعتبارسنجی شده است.

            فایل اصلی نصب: hamghadam-android.apk

            فایل SHA256SUMS.txt برای بررسی سلامت دانلود است.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist-download/hamghadam-android.apk
            dist-download/SHA256SUMS.txt
            dist-download/apk-badging.txt

      - name: Build summary
        if: always()
        run: |
          {
            echo "## هم‌قدم — نتیجه ساخت APK"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: #${{ github.run_number }}"
            echo
            echo "نسخه نهایی باید قبل از انتشار از نظر ZIP، امضا و Android Manifest بررسی شود."
            echo "لینک دانلود مستقیم (پس از موفقیت مرحله انتشار): https://github.com/nagshe-negar/rahe-talabegi/releases/tag/android-latest"
          } >> "$GITHUB_STEP_SUMMARY"
