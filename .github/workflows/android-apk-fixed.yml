name: Build Verified Android APK (Direct Download)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and verify Hamghadam APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run project tests
        run: npm test

      - name: Prepare web icon and manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s icon.png || { echo "::error::icon.png is missing from repository root."; exit 1; }
          mkdir -p public
          cp icon.png public/icon.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          additions = '''\n<link rel="icon" type="image/png" href="./icon.png">\n<link rel="apple-touch-icon" href="./icon.png">\n<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#176b67">\n'''
          if 'rel="manifest"' not in s:
              if '</head>' not in s:
                  raise SystemExit('Could not find </head> in index.html')
              s = s.replace('</head>', additions + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          cat > public/manifest.webmanifest <<'MANIFEST'
          {
            "name": "هم‌قدم",
            "short_name": "هم‌قدم",
            "description": "همراه مسیر علم، مطالعه و رشد",
            "lang": "fa",
            "dir": "rtl",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#f4f3ec",
            "theme_color": "#176b67",
            "icons": [{"src":"./icon.png","sizes":"any","type":"image/png","purpose":"any"}]
          }
          MANIFEST

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://gnbwcupxtbsjdgnncort.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6Re7lWtqy3kxrF8_SIYLsA_2j47_c20

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
        env:
          VITE_SUPABASE_URL: https://gnbwcupxtbsjdgnncort.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6Re7lWtqy3kxrF8_SIYLsA_2j47_c20

      - name: Apply Hamghadam launcher icon
        shell: bash
        run: |
          set -euo pipefail
          test -s icon.png || { echo "::error::icon.png is missing from repository root."; exit 1; }
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"; size="${item##*:}"; target="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$target"
            convert icon.png -resize "${size}x${size}" "$target/ic_launcher.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_round.png"
          done
          for item in "mdpi:108" "hdpi:162" "xhdpi:216" "xxhdpi:324" "xxxhdpi:432"; do
            density="${item%%:*}"; size="${item##*:}"; target="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$target"
            convert icon.png -resize "${size}x${size}" "$target/ic_launcher_foreground.png"
          done

      - name: Build clean debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK and prepare direct-download files
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist-download
          test -s "$APK"
          cp "$APK" dist-download/hamghadam-android.apk
          unzip -t dist-download/hamghadam-android.apk
          "$TOOLS/apksigner" verify --verbose dist-download/hamghadam-android.apk
          "$TOOLS/aapt" dump badging dist-download/hamghadam-android.apk | tee dist-download/apk-badging.txt
          grep -q "package: name='ir.rahetalabegi.app'" dist-download/apk-badging.txt
          grep -q "sdkVersion:" dist-download/apk-badging.txt
          (cd dist-download && sha256sum hamghadam-android.apk > SHA256SUMS.txt)

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamghadam-verified-apk
          path: |
            dist-download/hamghadam-android.apk
            dist-download/SHA256SUMS.txt
            dist-download/apk-badging.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Point direct-download release to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force android-latest "$GITHUB_SHA"
          git push --force origin refs/tags/android-latest

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: هم‌قدم — آخرین نسخه اندروید
          body: |
            آخرین APK برنامه هم‌قدم که در GitHub Actions ساخته و اعتبارسنجی شده است.
            فایل اصلی نصب: hamghadam-android.apk
            SHA256SUMS.txt برای بررسی سلامت دانلود است.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist-download/hamghadam-android.apk
            dist-download/SHA256SUMS.txt
            dist-download/apk-badging.txt

      - name: Build summary
        if: always()
        run: |
          {
            echo "## هم‌قدم — نتیجه ساخت APK"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: #${{ github.run_number }}"
            echo
            echo "نسخه نهایی باید قبل از انتشار از نظر ZIP، امضا و Android Manifest بررسی شود."
            echo "لینک دانلود مستقیم (پس از موفقیت مرحله انتشار): https://github.com/nagshe-negar/rahe-talabegi/releases/tag/android-latest"
          } >> "$GITHUB_STEP_SUMMARY"
