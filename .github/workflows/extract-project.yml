name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o rahe-talabegi-android-source.zip -d /tmp/project
          cp -a /tmp/project/rahe-talabegi-mobile/. .
          rm -f rahe-talabegi-android-source.zip
          rm -f .github/workflows/extract-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Rahe Talabegi project"
          git push
