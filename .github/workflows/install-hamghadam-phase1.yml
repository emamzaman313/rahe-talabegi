name: Install Hamghadam Phase 1

on:
  push:
    branches:
      - main
    paths:
      - hamghadam-phase1.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamghadam-phase1-install
  cancel-in-progress: false

jobs:
  install-test-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract and apply package
        id: prepare
        shell: bash
        run: |
          if [ ! -f hamghadam-phase1.zip ]; then
            echo "Package archive not present."
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_package=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/hamghadam-upload"
          unzip -q hamghadam-phase1.zip -d "$RUNNER_TEMP/hamghadam-upload"

          pwsh -NoProfile -File \
            "$RUNNER_TEMP/hamghadam-upload/hamghadam-phase1/install-hamghadam.ps1"

          rm -f hamghadam-phase1.zip

      - name: Correct security test
        if: steps.prepare.outputs.has_package == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("tests/backend-security.test.mjs")
          s = p.read_text(encoding="utf-8")

          old = """const client = fs.readFileSync(path.join(root, 'src/support-chat.js'), 'utf8');"""

          new = """const client = fs.readFileSync(path.join(root, 'src/support-chat.js'), 'utf8');
          const supabaseClient = fs.readFileSync(path.join(root, 'src/supabase-client.js'), 'utf8');"""

          if "const supabaseClient =" not in s:
              if old not in s:
                  raise SystemExit("Could not find expected client declaration.")
              s = s.replace(old, new, 1)

          old_assert = "  assert.match(client, /VITE_SUPABASE_PUBLISHABLE_KEY/);"
          new_assert = "  assert.match(supabaseClient, /VITE_SUPABASE_PUBLISHABLE_KEY/);"

          if old_assert in s:
              s = s.replace(old_assert, new_assert, 1)
          elif new_assert not in s:
              raise SystemExit("Could not find expected security assertion.")

          p.write_text(s, encoding="utf-8")
          print("Security test corrected.")
          PY

      - name: Install dependencies
        if: steps.prepare.outputs.has_package == 'true'
        run: npm install

      - name: Run tests
        if: steps.prepare.outputs.has_package == 'true'
        run: npm test

      - name: Build web app
        if: steps.prepare.outputs.has_package == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://gnbwcupxtbsjdgnncort.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Commit verified changes
        if: steps.prepare.outputs.has_package == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install and verify Hamghadam Phase 1"
          git push origin main
