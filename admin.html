<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>پنل مدیریت هم‌قدم</title>
  <style>
    :root{--bg:#eff5f0;--paper:#fff;--ink:#173a3e;--muted:#6c827a;--line:#dce9df;--teal:#176b62;--mint:#e1f3e9;--gold:#d5ab57;--red:#a64050}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,#dcefe5,transparent 28%),var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.8}.admin-wrap{max-width:1500px;margin:auto;padding:18px}.admin-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;background:linear-gradient(115deg,#123d45,#176b62);color:#fff;border-radius:20px;box-shadow:0 12px 36px #123d4517}.admin-brand{display:flex;align-items:center;gap:12px}.admin-logo{width:45px;height:45px;border:1px solid #ffffff35;border-radius:15px;display:grid;place-items:center;font-size:24px;color:#ffdda0;background:#ffffff12}.admin-brand h1{font-size:19px;margin:0}.admin-brand p{margin:0;font-size:11px;color:#c8e3db}.admin-identity{font-size:11px;color:#cde8df}.admin-alert{margin:12px 0;border:1px solid #cde3d4;background:#eef9f1;border-radius:12px;padding:12px;font-size:12px;color:#276353}.admin-alert.error{border-color:#efc7cd;background:#fff0f2;color:#8a3948}.admin-tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.admin-tab{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font:inherit;font-size:12px;color:#52716a;white-space:nowrap;cursor:pointer}.admin-tab.active{background:var(--mint);border-color:#b9ddc9;color:#145b50;font-weight:800}.admin-content{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:18px;min-height:440px;box-shadow:0 10px 30px #173d3108}.admin-content h2{font-size:20px;margin:0}.admin-content h3{font-size:15px;margin:0 0 8px}.admin-content p{font-size:12px;color:var(--muted)}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.admin-card{border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}.admin-form{display:grid;gap:9px}.admin-field{display:grid;gap:4px}.admin-field label{font-size:11px;font-weight:bold;color:#5e7970}.admin-field input,.admin-field select,.admin-field textarea{width:100%;border:1px solid #d9e7de;border-radius:10px;background:#fff;color:#183a3e;padding:9px 11px;font:inherit;font-size:12px;min-width:0}.admin-field textarea{resize:vertical;min-height:75px}.admin-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.admin-btn{border:1px solid #cfded5;border-radius:10px;background:#fff;color:#28594f;padding:8px 11px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.admin-btn.primary{color:#fff;background:var(--teal);border-color:var(--teal)}.admin-btn.danger{color:#9d3d4c;border-color:#f0cfd4;background:#fff5f6}.admin-btn:disabled{opacity:.45;cursor:wait}.admin-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}.admin-table{border-collapse:collapse;width:100%;min-width:760px;font-size:11px}.admin-table th,.admin-table td{text-align:right;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.admin-table th{background:#f0f7f1;color:#54746a}.admin-table tr:last-child td{border-bottom:0}.admin-muted{font-size:11px;color:var(--muted)}.admin-chip{display:inline-block;border-radius:100px;padding:2px 8px;background:#edf6ef;color:#41675b;font-size:10px;margin:2px}.admin-chip.red{background:#fff0f1;color:#9c3e4b}.admin-chip.gold{background:#fff5df;color:#7d6224}.admin-empty{border:1px dashed #cedfd3;border-radius:14px;padding:22px;text-align:center;color:#71857d;font-size:12px}.admin-switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #edf2ed;font-size:12px}.admin-switch:last-child{border-bottom:0}.admin-switch input{width:19px;height:19px;accent-color:var(--teal)}.admin-note{font-size:11px;background:#fff7e2;color:#775e25;border:1px solid #ecdcae;padding:10px;border-radius:11px}.admin-footer{text-align:center;color:#7e9188;font-size:10px;padding:16px}@media(max-width:760px){.admin-wrap{padding:8px}.admin-header{border-radius:15px;padding:12px}.admin-grid{grid-template-columns:1fr}.admin-content{padding:11px}.admin-brand h1{font-size:16px}}
    .admin-home-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#fff;color:#176b62;border:1px solid #dce9df;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap}.admin-home-link:hover{background:#e1f3e9}.admin-header .admin-home-link{order:-1}.admin-home-link:focus-visible,.admin-tab:focus-visible,.admin-btn:focus-visible{outline:3px solid #f2ce7c;outline-offset:2px}
  </style>
</head>
<body>
  <div class="admin-wrap">
    <header class="admin-header"><div class="admin-brand"><div class="admin-logo">▣</div><div><h1>پنل مدیریت هم‌قدم</h1><p>حساب‌ها، چت، گزارش‌ها، تم‌های مناسبتی و محتوا</p></div></div><div id="admin-identity" class="admin-identity">در حال بررسی مجوز…</div><a href="./index.html" class="admin-home-link" aria-label="بازگشت به برنامه">← بازگشت به برنامه</a></header>
    <div id="admin-alert"></div>
    <nav id="admin-tabs" class="admin-tabs" aria-label="بخش‌های مدیریت"></nav>
    <main id="admin-content" class="admin-content"><div class="admin-empty">در حال بررسی نشست و نقش مدیریت…</div></main>
    <footer class="admin-footer">مدیریت فقط با نقش سمت سرور مجاز است؛ مخفی‌کردن پنل جایگزین کنترل مجوز API و RLS نیست.</footer>
  </div>
  <script type="module" src="./src/hamghadam-admin-console.js"></script>
</body>
</html>
